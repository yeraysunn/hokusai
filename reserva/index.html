<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mi reserva · HOKUSAI Sushi</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+JP:wght@700;900&display=swap">
<style>
:root{--paper:#FAF3E3;--ink:#141414;--red:#D7263D;--navy:#1B2A6B;--yellow:#FFE600;--orange:#F2A33A;--card:#FFFBF2}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(20,20,20,.07) 1px,transparent 1.2px);background-size:7px 7px}
a{color:var(--navy)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--ink);background:var(--paper)}
.hanko{width:40px;height:40px;display:grid;place-items:center;background:var(--red);color:var(--paper);border:2px solid var(--ink);border-radius:6px;transform:rotate(-6deg);font:900 14px 'Noto Sans JP',sans-serif;writing-mode:vertical-rl}
.brand{font:400 24px Anton,sans-serif;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:36px 16px 80px}
.kana{font:900 14px 'Noto Sans JP',sans-serif;letter-spacing:.2em;color:var(--red)}
h1{margin:6px 0 18px;font:400 clamp(44px,12vw,72px)/.92 Anton,sans-serif;text-transform:uppercase}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:8px;box-shadow:8px 8px 0 var(--navy);padding:20px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:2px solid var(--ink)}
.row:last-child{border-bottom:0}
.row b{text-align:right}
.badge{display:inline-block;margin-bottom:16px;padding:8px 14px;border:3px solid var(--ink);border-radius:999px;font:400 20px Anton,sans-serif;letter-spacing:.05em;transform:rotate(-2deg)}
.pendiente{background:var(--orange)}.confirmada{background:var(--yellow)}.rechazada,.cancelada{background:var(--ink);color:var(--paper)}
p{line-height:1.55}
button{margin-top:18px;width:100%;min-height:54px;border:3px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);font:400 20px Anton,sans-serif;letter-spacing:.05em;cursor:pointer}
button.sure{background:var(--red);color:var(--paper);box-shadow:4px 4px 0 var(--ink)}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-weight:700}
</style>
</head>
<body>
<header><span class="hanko">北斎</span><a class="brand" href="/">HOKUSAI</a></header>
<main>
  <span class="kana">ヨヤク · TU RESERVA</span>
  <h1>Mi reserva</h1>
  <div class="panel" id="box"><p>Cargando…</p></div>
</main>
<script>
(function(){
  var t = new URLSearchParams(location.search).get('t');
  var box = document.getElementById('box');
  var TXT = { pendiente:['PENDIENTE · 確認中','El equipo la está revisando. Te avisamos por email en cuanto esté confirmada.'],
    confirmada:['CONFIRMADA · OK!','¡Te esperamos! Te guardamos la mesa 15 minutos.'],
    rechazada:['SIN MESA','Lo sentimos, no nos queda sitio a esa hora. <a href="/reservar">Prueba otra hora</a> o llámanos al 622 01 59 96.'],
    cancelada:['CANCELADA','Esta reserva está cancelada. <a href="/reservar">Hacer una nueva</a>.'] };
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(r){
    var x = TXT[r.estado] || [r.estado,''];
    box.innerHTML = '<span class="badge '+r.estado+'">'+x[0]+'</span>'+
      '<div class="row"><span>Día</span><b>'+esc(r.fechaTxt)+'</b></div>'+
      '<div class="row"><span>Hora</span><b>'+esc(r.hora)+'</b></div>'+
      '<div class="row"><span>Personas</span><b>'+esc(r.personas)+'</b></div>'+
      '<div class="row"><span>A nombre de</span><b>'+esc(r.nombre)+'</b></div>'+
      '<p>'+x[1]+'</p>'+
      ((r.estado==='pendiente'||r.estado==='confirmada') ? '<button id="c" type="button">CANCELAR RESERVA</button><div class="msg" id="m" role="status"></div>' : '');
    var c = document.getElementById('c'); if (!c) return;
    c.onclick = function(){
      if (!c.classList.contains('sure')) { c.classList.add('sure'); c.textContent = 'PULSA OTRA VEZ PARA CANCELAR'; return; }
      c.disabled = true;
      fetch('/api/reservas/estado',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:t,accion:'cancelar'})})
        .then(function(r){return r.json()}).then(function(j){ if (j.ok) render(j.reserva); else { c.disabled=false; document.getElementById('m').textContent=j.error; } })
        .catch(function(){ c.disabled=false; document.getElementById('m').textContent='No se pudo cancelar. Llámanos al 622 01 59 96.'; });
    };
  }
  if (!t) { box.innerHTML = '<p>Falta el enlace de la reserva. Revisa tu email.</p>'; return; }
  fetch('/api/reservas/estado?t='+encodeURIComponent(t)).then(function(r){return r.json()})
    .then(function(j){ if (j.ok) render(j.reserva); else box.innerHTML='<p>'+esc(j.error)+'</p>'; })
    .catch(function(){ box.innerHTML='<p>No se pudo cargar. Inténtalo de nuevo.</p>'; });
})();
</script>
</body>
</html>
